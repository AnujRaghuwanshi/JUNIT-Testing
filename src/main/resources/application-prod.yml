server:
  port: 8091

spring:
  application:
    name: CRUDApplication

  datasource:
    url: jdbc:mysql://localhost:3306/employeedb
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
