server:
  port: 8090

spring:
  application:
    name: CRUDApplication

  datasource:
    url: jdbc:mysql://localhost:3306/employeedb
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email
    password: app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true
